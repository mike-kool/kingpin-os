name: Deploy
# Production deploys from main; every same-repo pull request gets a preview
# URL. Needs two repository secrets: CLOUDFLARE_API_TOKEN (a token with the
# "Edit Cloudflare Workers" template) and CLOUDFLARE_ACCOUNT_ID.
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true
jobs:
  deploy:
    # Forks don't get the secrets, so they skip this job.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - name: Check for Cloudflare secrets
        if: env.HAS_TOKEN != 'true'
        run: echo "::notice::CLOUDFLARE_API_TOKEN is not set, so nothing is deployed."
      - uses: actions/checkout@v4
        if: env.HAS_TOKEN == 'true'
      - uses: pnpm/action-setup@v4
        if: env.HAS_TOKEN == 'true'
      - uses: actions/setup-node@v4
        if: env.HAS_TOKEN == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: env.HAS_TOKEN == 'true'
      - run: pnpm build
        if: env.HAS_TOKEN == 'true'
      - name: Deploy to production
        if: env.HAS_TOKEN == 'true' && github.event_name == 'push'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          command: deploy
      - name: Upload a preview
        id: preview
        if: env.HAS_TOKEN == 'true' && github.event_name == 'pull_request'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          command: versions upload --preview-alias pr-${{ github.event.number }}
      - name: Show the preview URL
        if: steps.preview.outcome == 'success'
        run: |
          echo "### Preview" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.preview.outputs.deployment-url }}" >> "$GITHUB_STEP_SUMMARY"
